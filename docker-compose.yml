services:
  nginx:
    container_name: label-studio-nginx
    build: .
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    ports:
      - "80:8085"
      - "443:8086"
    depends_on:
      - app
    environment:
      - LABEL_STUDIO_HOST=https://label.coligo.ai
      - CSRF_TRUSTED_ORIGINS=https://label.coligo.ai
      - SSRF_PROTECTION_ENABLED=true
      #   Optional: Specify SSL termination certificate & key
      #   Just drop your cert.pem and cert.key into folder 'deploy/nginx/certs'
      - NGINX_SSL_CERT=/certs/cert.pem
      - NGINX_SSL_CERT_KEY=/certs/privkey.pem
    volumes:
      - /mnt/labelstudio-volume-0/user_data:/label-studio/data:rw
      - /mnt/labelstudio-volume-0/user_data/nginx/certs:/certs:ro
      - /etc/letsencrypt/archive:/archive:ro
      - /etc/letsencrypt/live:/live:ro
      - /mnt/labelstudio-volume-0/user_data/nginx/webroot:/webroot:rw

      #   Optional: Override nginx default conf
      - /mnt/labelstudio-volume-0/user_data/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    #      - /mnt/labelstudio-volume-0/user_data/nginx/options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
    command: nginx

  app:
    container_name: label-studio-app
    stdin_open: true
    tty: true
    build: .
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      - db
    environment:
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=5432
      - POSTGRE_HOST=db
      - LABEL_STUDIO_HOST=https://label.coligo.ai
      - CSRF_TRUSTED_ORIGINS=https://label.coligo.ai
      - SSRF_PROTECTION_ENABLED=true
      - LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK=true
      - LABEL_STUDIO_USERNAME=admin@coligo.ai
      - LABEL_STUDIO_PASSWORD=Cavalier-Parasite-Sesame
      - JSON_LOG=1
    #      - DEBUG=1
    #      - LOG_LEVEL=DEBUG
    volumes:
      - /mnt/labelstudio-volume-0/user_data:/label-studio/data:rw
      - /mnt/labelstudio-volume-0/user_data/nginx/certs:/certs:ro
      - /etc/letsencrypt/archive:/archive:ro
      - /etc/letsencrypt/live:/live:ro
    command: label-studio-uwsgi

  db:
    image: pgautoupgrade/pgautoupgrade:17-alpine
    hostname: db
    restart: unless-stopped
    # Optional: Enable TLS on PostgreSQL
    # Just drop your server.crt and server.key into folder 'deploy/pgsql/certs'
    # NOTE: Both files must have permissions u=rw (0600) or less
    #    command: >
    #      -c ssl=on
    #      -c ssl_cert_file=/var/lib/postgresql/certs/server.crt
    #      -c ssl_key_file=/var/lib/postgresql/certs/server.key
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
      - PGUSER=postgres
    volumes:
      - /mnt/labelstudio-volume-0/user_data/postgres-data:/var/lib/postgresql/data
      - /mnt/labelstudio-volume-0/user_data/pgsql/certs:/var/lib/postgresql/certs:ro
